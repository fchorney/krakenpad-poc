[package]
name = "krakenpad"
description = "SDK for the KrakenPad dance pad's USB vendor interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# hidapi 2.6.7 with deadsync's backends, so its Windows 7 patch
# ([patch.crates-io]) covers the SDK too. One declaration for every target,
# plus the backend per OS; Cargo merges the features.
[features]
# Simulated pads (krakenpad::sim), for building and trying apps without a pad.
# Off by default, so games don't build it.
sim = []

[dependencies]
hidapi = { version = "2.6.7", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["linux-static-hidraw"] }

# Each pad is opened twice, a read handle for its reader thread and a write
# handle for callers, as rustmaniax-sdk does. macOS opens exclusively unless
# this is on; Linux (hidraw) and Windows already share.
[target.'cfg(target_os = "macos")'.dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["macos-shared-device"] }
