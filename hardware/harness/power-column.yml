metadata:
  title: 12V power column harness
  description: >
    One of three identical parallel column chains. Left = panels 0,3,6;
    Center = 1,4,7; Right = 2,5,8. 12V runs from the Wago lever-block fan-out
    (12v-trunk.yml) DIRECTLY to each column's first panel -- the master PCB is
    NOT in the 12V distribution path. Lever block at the source end, Micro-Fit
    3.0 2-pin at the panel end.
    FORK LUGS REMOVED 2026-08-16. This file used to describe "PSU terminals"
    with "fork lugs at the PSU end" and a "PSU GND stud". None of that exists --
    the stock supply is a brick with one captive output. Those were pre-teardown
    assumptions that survived far too long; the real source is the fan-out that
    replaces the Daygreen converter.
    Max chain load = 3 panels x 0.44 A = ~1.3 A, far inside the 5A/pin rating.
    Per panel = 25 LEDs x 15 mA full white + ~60 mA brain. The WS2815 datasheet's
    15 mA is PER PIXEL, not per channel -- its three dies are in series and unlit
    ones are shorted out, so red draws the same as white. Corrected 2026-08-16;
    the earlier 47 mA and 36 mA figures both came from multiplying by three.
  status: PROPOSED -- source end and lengths settled 2026-08-16 against the completed stock record.
  pn: HARNESS-PWR-01
  qty_per_pad: 3

options:
  color_mode: full

connectors:
  WAGO_12V:
    pn: Wago 221-415 (5-way lever block)
    type: Fan-out, +12V rail
    subtype: lever block port
    pincount: 1
    pinlabels: [V12]
    notes: >
      One of the three column ports on the +12V rail. Full drawing of the
      fan-out is 12v-trunk.yml.
      CORRECTED 2026-08-16: this was a "PSU +12V fork lug", which does not
      exist. The stock supply is a BRICK with a single captive output and no
      terminal block or ground stud; the pre-teardown design notes invented the
      lugs. 12V distribution is now a Wago lever block sitting where the
      Daygreen converter was.
  WAGO_GND:
    pn: Wago 221-415 (5-way lever block)
    type: Fan-out, GND rail
    subtype: lever block port
    pincount: 1
    pinlabels: [GND]
    notes: >
      One of the three column ports on the GND rail (two 221-415 jumpered, six
      ports, the extra being the master GND tie). See 12v-trunk.yml.
      CORRECTED 2026-08-16, as above -- there is no "PSU GND stud".

  P0_IN:
    pn: Micro-Fit 3.0 2-pin
    type: Panel A PWR IN
    subtype: Micro-Fit 3.0, 2-pin
    pincount: 2
    pinlabels: [V12, GND]
    notes: First panel in the column (0 / 1 / 2 depending on column).
  P0_OUT:
    pn: Micro-Fit 3.0 2-pin
    type: Panel A PWR OUT
    subtype: Micro-Fit 3.0, 2-pin
    pincount: 2
    pinlabels: [V12, GND]

  P1_IN:
    pn: Micro-Fit 3.0 2-pin
    type: Panel B PWR IN
    subtype: Micro-Fit 3.0, 2-pin
    pincount: 2
    pinlabels: [V12, GND]
    notes: Middle panel (3 / 4 / 5).
  P1_OUT:
    pn: Micro-Fit 3.0 2-pin
    type: Panel B PWR OUT
    subtype: Micro-Fit 3.0, 2-pin
    pincount: 2
    pinlabels: [V12, GND]

  P2_IN:
    pn: Micro-Fit 3.0 2-pin
    type: Panel C PWR IN
    subtype: Micro-Fit 3.0, 2-pin
    pincount: 2
    pinlabels: [V12, GND]
    notes: >
      Last panel in the column (6 / 7 / 8). Its PWR OUT is left empty --
      all panels are identical, so end-of-chain just means an unused connector.

cables:
  W_PSU:
    category: bundle
    gauge: 20 AWG
    length: 0.600
    colors: [RD, BK]
    notes: >
      LENGTH FROM THE STOCK RECORD 2026-08-16: 5v-columns.yml measures all
      THREE stock column feeds at 60 cm -- they are not different lengths, as
      this file previously assumed. Our fan-out sits where the Daygreen sat, so
      the run is the same. Stock jacketed 2x20 AWG.
      Re-measure only if the fan-out carrier ends up somewhere else.

  W_JUMP_A:
    category: bundle
    gauge: 20 AWG
    length: 0.600
    colors: [RD, BK]
    notes: >
      Panel-to-panel jumper, first to middle. LENGTH FROM THE STOCK RECORD
      2026-08-16: panel-power-chain.yml measures all six stock jumpers at 60 cm.

  W_JUMP_B:
    category: bundle
    gauge: 20 AWG
    length: 0.600
    colors: [RD, BK]
    notes: >
      Middle to last. CONFIRMED IDENTICAL TO W_JUMP_A 2026-08-16 -- stock runs
      60 cm in both positions (panel-power-chain.yml), so ONE JUMPER PART
      NUMBER COVERS BOTH and six identical jumpers build all three columns.

connections:
  - - WAGO_12V: [1]
    - W_PSU: [1]
    - P0_IN: [1]
  - - WAGO_GND: [1]
    - W_PSU: [2]
    - P0_IN: [2]

  - - P0_OUT: [1-2]
    - W_JUMP_A: [1-2]
    - P1_IN: [1-2]

  - - P1_OUT: [1-2]
    - W_JUMP_B: [1-2]
    - P2_IN: [1-2]
