metadata:
  title: Underglow adapter harness
  description: >
    Mates the stock underglow strip pigtail and feeds it 12V, GND and DATA.
    The strips themselves are NOT replaced -- they keep their own moulded
    3-pin SM plug, and this harness is its mate.
    REWRITTEN 2026-08-16. Everything upstream of the strips changed: the fork
    lugs and "PSU GND stud" this file used to describe DO NOT EXIST (the stock
    supply is a brick with one captive output), and the 12V star point they
    stood in for is replaced by the Wago lever-block fan-out in 12v-trunk.yml.
    12V and GND now come off that fan-out; DATA comes from master J2 pin 1.
    ALSO SUPERSEDED: a note that this harness "may not be needed at all",
    which assumed we KEEP the stock segment feeding the strips and only drive
    one wire into its JST YLR-01V. We remove all SMX wiring, so that segment
    goes with it. What survives is only the strips' own moulded plug, so this
    harness IS required. No YLP-01V is involved anywhere.
    Underglow is 44 groups of 3 LEDs (WS2811, 12V), 2.44 A at full white.
    Colour scales current linearly on this part -- unlike the panels' WS2815,
    where it does not. See docs/UNDERGLOW.md.
  status: PROPOSED -- this project's own design. Source end settled 2026-08-16 against the completed stock record.
  pn: HARNESS-UG-01
  qty_per_pad: 1

options:
  color_mode: full

connectors:
  STRIP:
    pn: 3-pin SM 2.5mm, LED-strip type (mates the strips' moulded plug)
    type: Underglow strips
    subtype: our half of the SM 3P pair
    pincount: 3
    pinlabels: [GND, DATA, V12]
    notes: >
      PIN ORDER IS pin 1 = GND, pin 2 = DATA, pin 3 = 12V. Confirmed at the
      2026-08-08 teardown and it REVERSES the original assumption of
      12V/DATA/GND -- building to the old order would have put 12V into the
      DATA pin and destroyed the first LED. The conductor SET was right; the
      ORDER was not.
      On the pad side the colors are yellow = 12V, white = DATA, black = GND.
      SOURCE IT AS A PRE-MADE LED-STRIP PIGTAIL PAIR, not as a housing plus
      loose contacts. The strips' connector is an LED-strip "SM 2.5" clone
      rather than true JST SM: the stock conductors are 18 AWG, while genuine
      JST SM contacts stop around 22 AWG (SMM-003T-P0.5 is 28-30 AWG, far too
      fine). A pre-made pair arrives crimped, needs no SM crimp tool, and its
      bare tails land straight into the lever blocks and J2.
      GENDER: TEST-FIT, DO NOT TRUST THE LISTING. LED-strip vendors label
      "male/female" by housing, not by JST's contact convention -- the exact
      trap that inverted the whole YL side of this project once already. Buy
      the pair, use whichever half mates the strips, keep the other as a spare.
      A JST SMR-03V-B housing (LCSC C157907) is on hand as a fallback if a
      pigtail ever has to be made up by hand.

  WAGO_12V:
    pn: Wago 221-415 (5-way lever block)
    type: Fan-out, +12V rail
    subtype: lever block port
    pincount: 1
    pinlabels: [V12]
    notes: >
      The underglow port on the +12V rail. Full drawing: 12v-trunk.yml.
      This replaces the "PSU +12V fork lug" this file used to name.

  WAGO_GND:
    pn: Wago 221-415 (5-way lever block)
    type: Fan-out, GND rail
    subtype: lever block port
    pincount: 2
    pinlabels: [GND_ug, GND_tie]
    notes: >
      Two ports on the GND rail: the underglow return, and the master's
      mandatory GND tie. This replaces the "PSU GND stud", which does not exist.
      THE GND TIE GETS ITS OWN PORT AND ITS OWN LEAD. It no longer rides the
      underglow cable, so unplugging or omitting underglow cannot break the
      RS-485/INT ground reference. That reference is mandatory -- separate
      grounds was a real bench failure mode during multi-panel bring-up.
      The GND rail needs two 221-415 jumpered (six ports total) precisely
      because of this extra tie; the +12V rail fits in one.

  J2:
    pn: KANGNEX WJ500V-5.08-2P 2-pos screw terminal (LCSC C8465)
    type: Master PCB J2
    subtype: 2-pos screw terminal, 5.08mm
    pincount: 2
    pinlabels: [DATA, GND_TIE]
    notes: >
      On the master PCB. Pin 1 = underglow DATA, fed from Teensy GPIO11 via the
      SN74AHCT1G125 buffer (U3) and a 330R series resistor (R5). Pin 2 = the
      mandatory GND tie to the pad ground network.
      Master logic is USB-powered and the master is NOT in the 12V path, so
      this tie is the master's only connection to the pad ground network.

cables:
  W_UG:
    category: bundle
    gauge: 22 AWG
    length: 0.500
    colors: [YE, WH, BK]
    notes: >
      The pre-made pigtail's own leads -- 22 AWG on the pair to hand, which is
      ample: underglow draws 2.44 A at full white across all 44 groups, against
      roughly 7 A of chassis ampacity for 22 AWG, and about 40 mV of drop over
      this run. Stock used 18 AWG here, which was oversized.
      Yellow = 12V, white = DATA, black = GND, matching the pad-side colors.
      TODO LENGTH -- depends on the master's mounting position and where the
      fan-out carrier sits. 0.50 m is a placeholder; a typical pre-made pigtail
      is only ~15 cm and will likely need extending.
      SPLIT BUNDLE: yellow and black go to the fan-out, white goes to the
      master. They are one cable only for the part of the run they share.

  W_TIE:
    category: bundle
    gauge: 20 AWG
    length: 0.500
    colors: [BK]
    notes: >
      Master GND tie, its own lead from J2 pin 2 to a GND lever port.
      MANDATORY EVEN IF UNDERGLOW IS NEVER FITTED. TODO LENGTH.

connections:
  - - STRIP: [3]
    - W_UG: [1]
    - WAGO_12V: [1]

  - - STRIP: [1]
    - W_UG: [3]
    - WAGO_GND: [1]

  - - STRIP: [2]
    - W_UG: [2]
    - J2: [1]

  - - J2: [2]
    - W_TIE: [1]
    - WAGO_GND: [2]
