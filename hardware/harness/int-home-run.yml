metadata:
  title: INT home runs (master J3-J11 to nine panel carriers)
  description: >
    The interrupt wires -- the sole gameplay input path. Open-drain: the panel
    RP2040 sinks the line to GND on press; it is pulled HIGH at the master.
    Home-run only, no daisy chain. Twisted pair with a dedicated GND return
    (adopted 2026-07-26) so the return does not ride the shared power ground
    network -- a deliberate departure from stock, whose 2-position panel blocks
    left the GND position EMPTY.
    LENGTHS CLOSED 2026-08-16, transcribed from the STOCK per-panel signal
    lines in panel-signal-lines.yml. Those are home runs from the MCU to the
    same nine panels, so their measured lengths transfer directly.
    STRUCTURE CHANGED 2026-08-16: this was one generic drawing at qty 9 with a
    single TODO length. It is now the real set of nine, because the nine
    lengths differ and they are what sizes the wire order -- the same reason
    panel-signal-lines.yml is drawn that way. qty_per_pad is therefore 1.
    NO MID-SPAN BREAKOUT -- DECIDED 2026-08-16. An 18-circuit wire-to-wire
    breakout was floated so the master could be removed without unthreading
    nine home runs. Dropped for the prototype to hold scope. Note it was never
    REQUIRED by this harness: the master end is already a keyed JST XH crimp
    housing and the panel end a screw terminal, so both ends are serviceable as
    drawn. The breakout was only ever a cable-management convenience, and it is
    purely additive if wanted later -- nothing here changes to accommodate it.
    +15 CM ON EVERY CABLE -- DECIDED 2026-10-02, at the start of cable
    building. The stock lengths above ran to a SEPARATE JST connector that sat
    between the signal lines and the stock MCU, not into the MCU board itself.
    Ours land directly on master J3-J11, so each run needs to reach further.
    The user set the allowance at 15 cm per cable; the stock figure is kept
    beside each new length. Set total 9.3 m -> 10.65 m.
    Caveat: the lengths assume the replacement master mounts where the stock
    Arduino Micro sat. The stock set fits 60 + 30 per row down + a column
    offset of 0 centre / 10 right / 30 left, in cm, which puts the MCU nearest
    panel 1 and slightly right of centre. Re-derive from that formula if the
    master moves rather than re-measuring all nine.
  status: PROPOSED -- this project's own design. Lengths now derived from the completed stock record.
  pn: HARNESS-INT-01
  qty_per_pad: 1

options:
  color_mode: full

connectors:
  M0: &master
    pn: JST B2B-XH-A / XHP-2
    type: Master J11 (UL)
    subtype: JST XH 2-pin, vertical
    pincount: 2
    pinlabels: [INT, GND]
    notes: >
      One connector per panel, silkscreened by pad position: UL U UR L C R
      DL D DR, left to right = panel 0 through 8. Keyed, so INT and GND cannot
      be swapped -- that swap on a screw terminal would read as a permanently
      stuck press. Master-side XH vs panel-side FSR PH also prevents
      cross-plugging.
      SLOT-TO-PANEL-ID AGREEMENT IS NOT ASSUMED. The silkscreen is a build aid
      only; the master learns the real mapping with the 'I' identify pulse and
      reports mismatches. See docs/RS485_PROTOCOL.md.
  M1:
    <<: *master
    type: Master J10 (U)
  M2:
    <<: *master
    type: Master J9 (UR)
  M3:
    <<: *master
    type: Master J8 (L)
  M4:
    <<: *master
    type: Master J7 (C)
  M5:
    <<: *master
    type: Master J6 (R)
  M6:
    <<: *master
    type: Master J5 (DL)
  M7:
    <<: *master
    type: Master J4 (D)
  M8:
    <<: *master
    type: Master J3 (DR)

  P0: &panel
    pn: KANGNEX WJ500V-5.08-2P
    type: Panel 0 (UL) carrier J214
    subtype: 2-pos screw terminal, 5.08mm
    pincount: 2
    pinlabels: [INT, GND]
    notes: >
      Screw terminal, so the panel end is field-serviceable without crimps.
      BOTH POSITIONS ARE USED, unlike stock -- position 2 is the dedicated
      twisted-pair GND return, not an empty spare.
  P1:
    <<: *panel
    type: Panel 1 (U) carrier J214
  P2:
    <<: *panel
    type: Panel 2 (UR) carrier J214
  P3:
    <<: *panel
    type: Panel 3 (L) carrier J214
  P4:
    <<: *panel
    type: Panel 4 (C) carrier J214
  P5:
    <<: *panel
    type: Panel 5 (R) carrier J214
  P6:
    <<: *panel
    type: Panel 6 (DL) carrier J214
  P7:
    <<: *panel
    type: Panel 7 (D) carrier J214
  P8:
    <<: *panel
    type: Panel 8 (DR) carrier J214

cables:
  W_P0:
    category: bundle
    gauge: 22 AWG
    length: 1.050
    colors: [WH, BK]
    notes: >
      Master J11 to panel 0 (UL). 105 cm (stock 90 + 15). Label UL.
      PER-PANEL IDENTIFICATION IS A PRINTED LABEL UNDER CLEAR HEAT-SHRINK AT
      BOTH ENDS (decided 2026-08-31), not conductor color -- the chosen twisted
      pair comes in one color only. The label reads the panel's PHYSICAL
      POSITION (UL/U/UR/L/C/R/DL/D/DR), the same string as the master's J3-J11
      silkscreen, never the panel ID. Laser-printed; slide the shrink on BEFORE
      crimping. Full rules in WIRE_COLORS.md. The same convention applies to all
      nine cables below.
      Superseded, kept as the documented fallback in WIRE_COLORS.md: the
      2026-08-17 two-band row/column color code (rows RED/YELLOW/GREEN, columns
      BLUE/WHITE/VIOLET), which itself replaced the stock SMX 0=Red..8=Black
      map. The per-cable notes below used to carry single marker colors left
      over from that stock map -- already stale before 2026-08-31.
  W_P1:
    category: bundle
    gauge: 22 AWG
    length: 0.750
    colors: [WH, BK]
    notes: Master J10 to panel 1 (U). 75 cm (stock 60 + 15) -- shortest of the nine. Label U.
  W_P2:
    category: bundle
    gauge: 22 AWG
    length: 0.850
    colors: [WH, BK]
    notes: Master J9 to panel 2 (UR). 85 cm (stock 70 + 15). Label UR.
  W_P3:
    category: bundle
    gauge: 22 AWG
    length: 1.350
    colors: [WH, BK]
    notes: Master J8 to panel 3 (L). 135 cm (stock 120 + 15). Label L.
  W_P4:
    category: bundle
    gauge: 22 AWG
    length: 1.050
    colors: [WH, BK]
    notes: Master J7 to panel 4 (C). 105 cm (stock 90 + 15). Label C.
  W_P5:
    category: bundle
    gauge: 22 AWG
    length: 1.150
    colors: [WH, BK]
    notes: Master J6 to panel 5 (R). 115 cm (stock 100 + 15). Label R.
  W_P6:
    category: bundle
    gauge: 22 AWG
    length: 1.650
    colors: [WH, BK]
    notes: >
      Master J5 to panel 6 (DL). 165 cm (stock 150 + 15) -- longest of the nine. Label DL.
      TOTAL FOR THE SET: 10.65 m of 24 AWG twisted pair before slack (was
      9.3 m, the same total the stock signal lines came to in 18 AWG, before
      the +15 cm per cable added 2026-10-02 -- see metadata).
  W_P7:
    category: bundle
    gauge: 22 AWG
    length: 1.350
    colors: [WH, BK]
    notes: Master J4 to panel 7 (D). 135 cm (stock 120 + 15). Label D.
  W_P8:
    category: bundle
    gauge: 22 AWG
    length: 1.450
    colors: [WH, BK]
    notes: Master J3 to panel 8 (DR). 145 cm (stock 130 + 15). Label DR.

connections:
  - - M0: [1-2]
    - W_P0: [1-2]
    - P0: [1-2]
  - - M1: [1-2]
