metadata:
  title: RS-485 bus chain
  description: >
    Single daisy-chained differential bus, master plus all nine panels, at
    1 Mbps. Physical order matches the stock SMX serpentine routing exactly:
    master, 0(UL), 3(L), 6(DL), 7(D), 4(C), 1(U), 2(UR), 5(R), 8(DR).
    Carries the LED broadcast and the FSR telemetry round-robin poll -- NOT the
    press path, which is the separate INT home-run harness.
    Termination: 120R at the master end and at the last panel in the chain
    (selected by that panel's DPDT switch -- all nine panels are identical).
  status: PROPOSED -- this project's own design, written pre-teardown. Provisional until the stock record is complete.
  pn: HARNESS-485-01
  qty_per_pad: 1

options:
  color_mode: full

connectors:
  MASTER:
    pn: Micro-Fit 3.0 3-pin
    type: Master PCB J1
    subtype: Micro-Fit 3.0, 3-pin
    pincount: 3
    pinlabels: [A, B, SHLD]
    notes: >
      Pin 3 is the ONLY DC ground reference for the cable shield in the whole
      pad (J1 pin 3 ties to master GND). Every panel passes the shield through
      without a local GND tie, each with a 100nF parallel 1M to GND.
      This hybrid grounding scheme was adopted 2026-07-26, reversing both the
      earlier "unpopulated 3rd pin" and "drain floating at both ends" calls.

